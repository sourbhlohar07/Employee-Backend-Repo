spring.application.name=${APP_NAME}

# Kafka - set to true to enable Kafka features
kafka.enabled=${KAFKA_ENABLED}

# Email - set to true to enable email features
email.enabled=${EMAIL_ENABLED}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}

app.jwt.issuer=${JWT_ISSUER}
app.jwt.access-minutes=15
app.jwt.secret=${JWT_SECRET}
app.jwt.refresh-days=7
server.error.include-message=always


# Kafka connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka authentication - confirm the mechanism with your provider
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}

# Producer: send JSON as a String
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Consumer: receive JSON as a String
spring.kafka.consumer.group-id=aivra-enquiry-email
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Email provider - SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Aivra sender identity
aivra.mail.from=${MAIL_FROM}
